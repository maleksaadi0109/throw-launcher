name: Build Throw Rust on Windows
on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/throw-rust/**"
      - "branding/throw-launcher.ico"
      - ".github/workflows/throw-rust-windows.yml"
  pull_request:
    paths:
      - "desktop/throw-rust/**"
      - "branding/throw-launcher.ico"
      - ".github/workflows/throw-rust-windows.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/throw-rust
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update; rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test engine on Windows
        run: cargo test --locked
      - name: Build standalone native executable
        run: cargo build --release --locked
      - name: Exercise native controls and profile persistence
        run: |
          $process = Start-Process -FilePath ./target/release/throw-rust.exe -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Native smoke test timed out"
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path smoke-error.txt) { Get-Content smoke-error.txt }
            throw "Native smoke test failed: $($process.ExitCode)"
          }
          if (-not (Test-Path ./target/release/smoke-result.txt)) { throw "No runtime evidence produced" }
          Get-Content ./target/release/smoke-result.txt
      - name: Save native design screenshots
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force "../../generated-artifacts/throw-rust/screenshots" | Out-Null
          foreach ($theme in @("ink", "paper", "commands")) {
            $bmp = [System.Drawing.Bitmap]::FromFile("$PWD/target/release/throw-$theme.bmp")
            try {
              $bmp.Save("$PWD/../../generated-artifacts/throw-rust/screenshots/throw-$theme.png", [System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bmp.Dispose() }
          }
      - name: Package Rust preview
        run: |
          $out = "../../generated-artifacts/throw-rust"
          New-Item -ItemType Directory -Force "$out/package" | Out-Null
          Copy-Item ./target/release/throw-rust.exe "$out/package/Throw.Rust.exe"
          Copy-Item branding/throw-rust.ico "$out/package/Throw-Launcher.ico"
          Copy-Item README.md "$out/package/README.md"
          Copy-Item ../../LICENSE "$out/package/LICENSE.txt"
          Copy-Item ./target/release/smoke-result.txt "$out/package/CI-memory-sample.txt"
          Compress-Archive "$out/package/*" "$out/Throw-Rust-Windows-x64.zip"
          Get-Item "$out/package/Throw.Rust.exe" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: throw-rust-windows-x64
          path: generated-artifacts/throw-rust/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: throw-rust-design-screenshots
          path: generated-artifacts/throw-rust/screenshots/*.png
          if-no-files-found: error
