[package]
name = "throw-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A native, keyboard-first Windows launcher without a web runtime"
license = "MIT"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "throw-rust"
path = "src/main.rs"
